<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#ffffff"/>
  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">MBAX 6418 Course Assistant — Hybrid RAG Architecture</text>
  <text x="620" y="58" text-anchor="middle" font-size="13" fill="#4a5568">Gradio app · Python · bm25s + ChromaDB · class model services on dobolyi.com (ports 9001–9005)</text>

  <!-- ============ 1. Document preparation ============ -->
  <rect x="30" y="90" width="340" height="330" rx="10" fill="#ebf4ff" stroke="#90cdf4" stroke-width="1.5"/>
  <text x="200" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">1 · Document preparation</text>

  <rect x="55" y="132" width="290" height="52" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="200" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Upload (PDF / PPTX / DOCX / TXT / images)</text>
  <text x="200" y="172" text-anchor="middle" font-size="11" fill="#4a5568">Gradio "Course materials" tab · dedupe by name + SHA-256</text>

  <line x1="200" y1="184" x2="200" y2="204" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="55" y="206" width="290" height="52" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="200" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Render every page/slide to PNG</text>
  <text x="200" y="246" text-anchor="middle" font-size="11" fill="#4a5568">PyMuPDF · LibreOffice / Keynote / PowerPoint for PPTX</text>

  <line x1="200" y1="258" x2="200" y2="278" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="55" y="280" width="290" height="54" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="200" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Parse page images → structured text</text>
  <text x="200" y="321" text-anchor="middle" font-size="11" fill="#4a5568">9005 dots.mocr (table→HTML, formula→LaTeX); fallback to embedded text</text>

  <line x1="200" y1="332" x2="200" y2="352" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="55" y="354" width="290" height="52" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="200" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Chunk (RecursiveCharacter, 800 / 100 overlap)</text>
  <text x="200" y="394" text-anchor="middle" font-size="11" fill="#4a5568">keeps doc_id + page/slide/section metadata → index/index.json</text>

  <!-- ============ 2. Indexing ============ -->
  <rect x="450" y="90" width="340" height="330" rx="10" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1.5"/>
  <text x="620" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b46c1">2 · Indexing (separate text &amp; visual)</text>

  <rect x="475" y="132" width="290" height="44" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="620" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">Keyword index — bm25s (sparse)</text>
  <text x="620" y="167" text-anchor="middle" font-size="11" fill="#4a5568">chunk text, English stopwords</text>

  <rect x="475" y="192" width="290" height="44" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="620" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">Text index — 9002 embeddings (dim 2048)</text>
  <text x="620" y="227" text-anchor="middle" font-size="11" fill="#4a5568">Nemotron-3-Embed-1B → ChromaDB "text_chunks"</text>

  <rect x="475" y="252" width="290" height="44" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="620" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">Visual index — 9003 embeddings (dim 2048)</text>
  <text x="620" y="286" text-anchor="middle" font-size="10.5" fill="#4a5568">Qwen3-VL-Embedding-2B on slide images → ChromaDB "pages"</text>

  <rect x="475" y="312" width="290" height="44" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="620" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">Remove document → cleanup</text>
  <text x="620" y="347" text-anchor="middle" font-size="11" fill="#4a5568">delete file, chunks, images; rebuild indexes (req 1a)</text>

  <rect x="475" y="372" width="290" height="36" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="620" y="395" text-anchor="middle" font-size="12" fill="#2d3748">index/index.json is the source of truth (regenerable)</text>

  <!-- ============ 3. Retrieval & answer ============ -->
  <rect x="870" y="90" width="340" height="330" rx="10" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/>
  <text x="1040" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">3 · Query → grounded answer</text>

  <rect x="895" y="132" width="290" height="44" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="1040" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">Question (+ optional doc / topic filter)</text>
  <text x="1040" y="167" text-anchor="middle" font-size="11" fill="#4a5568">RRF: BM25 + dense text; visual stays separate</text>

  <line x1="1040" y1="176" x2="1040" y2="194" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="895" y="196" width="290" height="44" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="1040" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">Text-only rerank — 9004 (Qwen3-VL)</text>
  <text x="1040" y="231" text-anchor="middle" font-size="11" fill="#4a5568">Text strings scored; images not fused or reranked</text>

  <line x1="1040" y1="240" x2="1040" y2="258" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="895" y="260" width="290" height="44" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="1040" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">Grounded generation — 9001 vision LLM</text>
  <text x="1040" y="295" text-anchor="middle" font-size="11" fill="#4a5568">Text + indexed images (also in keyword mode)</text>

  <line x1="1040" y1="304" x2="1040" y2="322" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="895" y="324" width="290" height="44" rx="6" fill="#c6f6d5" stroke="#68d391"/>
  <text x="1040" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">Structured {answer, sources[]} + validation</text>
  <text x="1040" y="359" text-anchor="middle" font-size="11" fill="#22543d">Schema + text/image source checks; not semantic proof</text>

  <rect x="895" y="380" width="290" height="32" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="1040" y="401" text-anchor="middle" font-size="11" fill="#2d3748">NOT_COVERED: refusal / fallback; may retry once</text>

  <!-- arrows between columns -->
  <line x1="370" y1="250" x2="440" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="250" x2="860" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 4. Quiz ============ -->
  <rect x="30" y="460" width="1180" height="120" rx="10" fill="#fffff0" stroke="#ecc94b" stroke-width="1.5"/>
  <text x="620" y="488" text-anchor="middle" font-size="15" font-weight="bold" fill="#975a16">4 · Practice quiz (fixed answer key, solutions hidden)</text>

  <rect x="55" y="502" width="220" height="60" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="165" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">Pick document + topic filter</text>
  <text x="165" y="543" text-anchor="middle" font-size="11" fill="#4a5568">chunks + slide images for that doc</text>

  <line x1="275" y1="532" x2="315" y2="532" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="317" y="502" width="260" height="60" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="447" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">LLM (9001) writes MCQ + explanations</text>
  <text x="447" y="543" text-anchor="middle" font-size="11" fill="#4a5568">sources grounded, option validation, 4 options each</text>

  <line x1="577" y1="532" x2="617" y2="532" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="619" y="502" width="240" height="60" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="739" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">quiz.json (public) + quiz_key.json (hidden)</text>
  <text x="739" y="543" text-anchor="middle" font-size="11" fill="#4a5568">key stays server-side; results/quiz_key_* is gitignored</text>

  <line x1="859" y1="532" x2="899" y2="532" stroke="#4a5568" marker-end="url(#arrow)"/>

  <rect x="901" y="502" width="280" height="60" rx="6" fill="#c6f6d5" stroke="#68d391"/>
  <text x="1041" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">Score against key; reveal explanations on request</text>
  <text x="1041" y="543" text-anchor="middle" font-size="11" fill="#22543d">explanations cite verified sources + slide images</text>

  <!-- ============ 5. Class services ============ -->
  <rect x="30" y="620" width="1180" height="90" rx="10" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="620" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">Class model services — dobolyi.com (keys from local .env, never committed)</text>

  <rect x="55" y="662" width="215" height="36" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="162" y="676" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a202c">9001 · Vision LLM</text>
  <text x="162" y="691" text-anchor="middle" font-size="10" fill="#4a5568">Qwen3.6-35B-A3B (answers, quizzes)</text>

  <rect x="285" y="662" width="215" height="36" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="392" y="676" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a202c">9002 · Text embeddings</text>
  <text x="392" y="691" text-anchor="middle" font-size="10" fill="#4a5568">Nemotron-3-Embed-1B, dim 2048</text>

  <rect x="515" y="662" width="215" height="36" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="622" y="676" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a202c">9003 · Visual embeddings</text>
  <text x="622" y="691" text-anchor="middle" font-size="10" fill="#4a5568">Qwen3-VL-Embedding-2B, dim 2048</text>

  <rect x="745" y="662" width="215" height="36" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="852" y="676" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a202c">9004 · Text-only rerank</text>
  <text x="852" y="691" text-anchor="middle" font-size="10" fill="#4a5568">Qwen3-VL-Reranker-2B</text>

  <rect x="975" y="662" width="215" height="36" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="1082" y="676" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a202c">9005 · Document parsing</text>
  <text x="1082" y="691" text-anchor="middle" font-size="10" fill="#4a5568">dots.mocr (page image → layout JSON)</text>

  <!-- bottom arrow: index -> services -->
  <text x="620" y="750" text-anchor="middle" font-size="12" fill="#4a5568">All model calls run server-side; the UI never sees the API key. Errors are scrubbed before reaching the browser.</text>
  <text x="620" y="772" text-anchor="middle" font-size="12" fill="#4a5568">Automated checks: 64 unit/end-to-end tests · probe_services.py · smoke.py · run_evals.py (hybrid vs keyword baseline)</text>
</svg>
